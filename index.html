<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Julio César & Yolanda</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />

<style>
body {
  margin: 0;
  background: #f8f5f0;
  font-family: 'Cormorant Garamond', serif;
}

.card {
  background: #fdfaf4;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  padding: 0 25px 50px 25px;
  position: relative;
}

/* ... Tus otros estilos de .top-image, .floral-top, .names, etc. se mantienen iguales ... */

/* PORTADA MEJORADA PARA PARECERSE A TU REFERENCIA */
.cover {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&q=80') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  overflow: hidden;
}

.cover-content {
  position: relative;
  width: 92vw;
  max-width: 460px;
  min-height: 82vh;
  background: rgba(255, 250, 245, 0.92);
  box-shadow: 0 12px 50px rgba(0,0,0,0.1);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 45px 25px;
  text-align: center;
  box-sizing: border-box;
}

.wreath-wrapper {
  position: relative;
  width: 100%;
  max-width: 340px;
  margin-bottom: 35px;
}

.wreath {
  width: 100%;
  height: auto;
}

.names-in-wreath {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Great Vibes', cursive;
  font-size: 3.8rem;
  color: #d4b078;
  line-height: 0.9;
  text-align: center;
  width: 95%;
  margin: 0;
}

.separator {
  font-size: 1.8rem;
  color: #d4b078;
  margin: 25px 0 35px;
  letter-spacing: 8px;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 1.35rem;
  color: #8b6e34;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin: 0 0 25px;
}

.message-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  color: #8b6e34;
  line-height: 1.65;
  margin: 0 0 40px;
  max-width: 88%;
}

.date {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  color: #8b6e34;
  letter-spacing: 4px;
  margin-bottom: 10px;
}

.year {
  font-size: 1.4rem;
  margin-top: 5px;
}

.location {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  color: #a3916e;
  margin-top: 30px;
}

.cover-button {
  padding: 14px 50px;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  background: #7a9477;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  margin-top: 40px;
  box-shadow: 0 6px 20px rgba(122,148,119,0.3);
}

.cover-button:hover {
  background: #6a8467;
}

/* Responsive para celular */
@media (max-width: 480px) {
  .cover-content {
    padding: 35px 20px;
  }
  .names-in-wreath {
    font-size: 3rem;
  }
  .wreath-wrapper {
    max-width: 300px;
  }
  .date {
    font-size: 1.5rem;
  }
  .title {
    font-size: 1.2rem;
  }
}

body.cover-open {
  overflow: hidden;
}
</style>
</head>

<body class="cover-open">

<div class="cover" id="cover">
  <div class="cover-content">
    <div class="wreath-wrapper">
      <img src="https://img.freepik.com/vector-gratis/marco-floral-dorado-diseno-acuarela_23-2148536364.jpg" alt="marco floral dorado" class="wreath" />
      <div class="names-in-wreath">
        Julio César<br>&<br>Yolanda
      </div>
    </div>

    <div class="separator">♦ ♦ ♦</div>

    <div class="title">QUIEREN INVITARTE A SU BODA</div>

    <p class="message-text">
      Nos complace la idea de que nos acompañes en nuestro día especial,<br>se ruega confirmación.
    </p>

    <div class="date">
      SÁBADO 6 JUNIO
    </div>
    <div class="year">2026</div>

    <p class="location">
      Iglesia de Santiago & Salón La Antigua,<br>San Luis Potosí, S.L.P.
    </p>

    <button class="cover-button" onclick="abrirInvitacion()">ABRIR INVITACIÓN</button>
  </div>
</div>

<!-- Aquí pega tu audio, card, secciones, RSVP y script original -->
<!-- Por ejemplo: -->

<audio id="musica" loop>
  <source src="Romance.mp3" type="audio/mpeg" />
</audio>

<div class="card">
  <!-- Todo tu contenido de la invitación aquí, sin cambios -->
</div>

<script>
function abrirInvitacion() {
  document.getElementById('cover').style.display = 'none';
  document.body.classList.remove('cover-open');
  document.getElementById('musica').play();
}

// Tu función confirmarAsistencia() se mantiene igual
</script>

</body>
</html>
