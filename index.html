<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#f9f9f9;
    color:#333;
    text-align:center;
}

#inicio {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:white;
}

.boton-abrir {
    padding:15px 40px;
    font-size:18px;
    border:none;
    background:#2e7d32;
    color:white;
    border-radius:30px;
    cursor:pointer;
}

#invitacion {
    display:none;
    padding:40px 20px;
    background:white;
    position:relative;
}

/* Enredaderas suaves */
.enredadera-top {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    opacity:0.1;
}

.enredadera-bottom {
    position:absolute;
    bottom:0;
    right:0;
    width:100%;
    opacity:0.1;
}

h1 {
    font-family:'Playfair Display', serif;
    font-size:40px;
}

.fecha {
    font-size:20px;
    margin-bottom:30px;
}

.seccion {
    margin:50px 0;
}

.imagen {
    width:80%;
    max-width:400px;
    border-radius:20px;
    margin:20px 0;
}

.confirmacion {
    margin-top:40px;
}

input, button {
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

.boton-confirmar {
    background:#2e7d32;
    color:white;
    border:none;
    cursor:pointer;
}

.familia-box {
    background:#f1f8f4;
    padding:15px;
    border-radius:15px;
    margin-bottom:30px;
}

</style>
</head>
<body>

<div id="inicio">
    <h1>Nuestra Boda</h1>
    <button class="boton-abrir" onclick="abrirInvitacion()">Abrir Invitación</button>
</div>

<div id="invitacion">

    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" class="enredadera-top">
    <img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3" class="enredadera-bottom">

    <h1>Julio & Yolanda</h1>
    <div class="fecha">6 de Junio 2026</div>

    <div id="datosFamilia"></div>

    <div class="seccion">
        <h2>Ceremonia</h2>
        <p>Iglesia de Santiago</p>
        <img class="imagen" src="https://images.unsplash.com/photo-1520854221256-17451cc331bf">
    </div>

    <div class="seccion">
        <h2>Recepción</h2>
        <p>La Antigua</p>
        <img class="imagen" src="https://images.unsplash.com/photo-1519741497674-611481863552">
    </div>

    <div class="confirmacion">
        <h2>Confirmar Asistencia</h2>
        <input type="number" id="cantidad" placeholder="¿Cuántas personas?" min="1">
        <br>
        <button class="boton-confirmar" onclick="confirmar()">Confirmar por WhatsApp</button>
    </div>

</div>

<audio id="musica" src="musica1.mp3"></audio>

<script>

function abrirInvitacion() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("invitacion").style.display = "block";
    document.getElementById("musica").play();
}

/* Leer parámetros del link */
const params = new URLSearchParams(window.location.search);
const familia = params.get("familia");
const lado = params.get("lado");
const max = params.get("max");

if(familia && max){
    document.getElementById("datosFamilia").innerHTML = `
        <div class="familia-box">
            <h3>Familia ${familia}</h3>
            <p>Tienen ${max} lugares reservados</p>
        </div>
    `;
}

function confirmar(){

    const cantidad = document.getElementById("cantidad").value;

    if(!cantidad){
        alert("Por favor ingresa cantidad");
        return;
    }

    if(max && cantidad > max){
        alert("Solo pueden confirmar hasta " + max + " personas");
        return;
    }

    const numero = "524445391211"; // TU NUMERO CON LADA 52
    const mensaje = `Hola, confirmamos ${cantidad} personas de la familia ${familia} para el 6 de Junio 💚`;

    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank");
}

</script>

</body>
</html>
