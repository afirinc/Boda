<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julio César & Yolanda</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background: #f8f5f0;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* PORTADA CON MOVIMIENTO AL DESLIZAR */
    .cover {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      overflow: hidden;
      transition: transform 0.8s ease-out;
    }

    .cover-content {
      position: relative;
      width: 90vw;
      max-width: 480px;
      min-height: 80vh;
      background: rgba(255, 250, 245, 0.88);
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px 30px;
      text-align: center;
      transform: translateY(0);
      transition: transform 0.6s ease;
    }

    .wreath-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-bottom: 40px;
      transition: transform 0.8s ease-out;
    }

    .wreath {
      width: 100%;
      height: auto;
      transition: transform 0.8s ease-out;
    }

    .names-in-wreath {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #c9a96e;
      line-height: 1;
      text-align: center;
      width: 90%;
      margin: 0;
      transition: transform 0.8s ease-out;
    }

    .separator {
      font-size: 1.5rem;
      color: #c9a96e;
      margin: 20px 0 30px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #8b6e34;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 20px;
    }

    .message-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: #8b6e34;
      line-height: 1.6;
      margin: 0 0 35px;
      max-width: 85%;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: #8b6e34;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .location {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: #a3916e;
      margin-bottom: 50px;
    }

    .cover-button {
      padding: 14px 45px;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      background: #7a9477;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(122,148,119,0.3);
    }

    .cover-button:hover {
      background: #6a8467;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .names-in-wreath {
        font-size: 2.8rem;
      }
      .wreath-wrapper {
        max-width: 280px;
      }
    }

    body.cover-open {
      overflow: hidden;
    }
  </style>
</head>

<body class="cover-open">

<div class="cover" id="cover">
  <div class="cover-content">
    <div class="wreath-wrapper">
      <img src="https://img.freepik.com/vector-gratis/marco-floral-dorado-diseno-acuarela_23-2148536364.jpg" alt="marco floral" class="wreath" />
      <div class="names-in-wreath">
        Julio César<br>&<br>Yolanda
      </div>
    </div>

    <div class="separator">✦ ✦ ✦</div>

    <div class="title">QUIEREN INVITARTE A SU BODA</div>

    <p class="message-text">
      Nos complace la idea de que nos acompañes en nuestro día especial,<br>se ruega confirmación.
    </p>

    <div class="date">
      SÁBADO 6 JUNIO 2026
    </div>

    <p class="location">
      Iglesia de Santiago & Salón La Antigua,<br>San Luis Potosí, S.L.P.
    </p>

    <button class="cover-button" onclick="abrirInvitacion()">ABRIR INVITACIÓN</button>
  </div>
</div>

<!-- Aquí pegas el resto de tu código: audio, card, secciones, script, etc. -->

<script>
  // Efecto de movimiento al deslizar/touch
  const cover = document.querySelector('.cover');
  const wreath = document.querySelector('.wreath-wrapper');
  const names = document.querySelector('.names-in-wreath');

  let lastScroll = 0;

  window.addEventListener('scroll', () => {
    const scroll = window.scrollY;
    const delta = scroll - lastScroll;

    if (delta > 0) {
      // Deslizando hacia abajo
      wreath.style.transform = `translateY(${scroll * 0.1}px) scale(1.05)`;
      names.style.transform = `translate(-50%, -50%) translateY(${scroll * 0.15}px)`;
    } else {
      // Deslizando hacia arriba
      wreath.style.transform = `translateY(${scroll * 0.1}px) scale(1)`;
      names.style.transform = `translate(-50%, -50%) translateY(${scroll * 0.15}px)`;
    }

    lastScroll = scroll;
  });

  // Para touch en móvil (más suave)
  let touchStartY = 0;
  window.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
  });

  window.addEventListener('touchmove', e => {
    const touchY = e.touches[0].clientY;
    const delta = touchStartY - touchY;

    wreath.style.transform = `translateY(\( {delta * 0.08}px) scale( \){1 + delta * 0.0005})`;
    names.style.transform = `translate(-50%, -50%) translateY(${delta * 0.12}px)`;
  });

  function abrirInvitacion() {
    document.getElementById('cover').style.display = 'none';
    document.body.classList.remove('cover-open');
    document.getElementById('musica').play();
  }
</script>

</body>
</html>
